name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
  
  steps:
    - name: Check out code
      uses: actions/checkout@v6 

    - name: Install uv 
      uses: astral-sh/setup-uv@v8.2.0
      with:
        enable-cache: true
    
    - name: Install dependencies
      run: uv sync --locked

    - name: Lint (ruff)
      run: uv run ruff check . --output-format=github

    - name: Format check (ruff)
      run: uv run ruff format --check .

    - name: Test (pytest)
      run: uv run pytest
